    <ellipse cx="697" cy="355" rx="137" ry="23"/>
    <ellipse cx="697" cy="418" rx="137" ry="23"/>
  </g>

  <g fill="none" stroke="#20356a" stroke-width="2.5" stroke-linecap="round">
    <circle cx="92" cy="247" r="11"/>
