<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 484" width="1060" height="484" role="img" aria-labelledby="title desc">
  <title id="title">Use Case Diagram Sistem Aset Kampus ULBI</title>
  <desc id="desc">Pemohon dan Admin dapat masuk ke sistem. Pemohon melihat katalog dan kalender, mencari rekomendasi, mengajukan peminjaman, dan melihat status serta riwayat. Admin melihat dasbor, mengelola ruang dan sarana, meninjau pengajuan, mencatat pengembalian dan kondisi, serta melihat laporan.</desc>
